# Needs a bond-based peridynamics BRANCH build of 4C, not upstream 4C.
# PRE_CRACKS and IMPACTOR_VELOCITY (PARTICLE DYNAMIC/PD) and the per-particle
# PDFIXED flag (PARTICLES) are not upstream 4C input: upstream's PARTICLE
# DYNAMIC/PD rejects the two keys with "Could not match this input", and its
# particle reader has no PDFIXED state (it takes RAD, RIGIDCOLOR, PDBODYID
# and, from v2026.2.0, DIRICHLET_FUNCT and BOUNDARYID) and aborts with
# "Optional particle state with label 'PDFIXED' unknown!". On upstream 4C,
# DIRICHLET_BOUNDARY_CONDITION prescribes motion for a whole particle phase,
# and from v2026.2.0 the per-particle DIRICHLET_FUNCT <funct> (phase listed in
# DIRICHLET_BOUNDARY_CONDITION_FLAGGED) does it for single particles; from
# v2026.2.0 upstream pre-cracks are PRE_CRACK_LINES (list of START/END
# 3-vectors) or PRE_CRACK_PLANES (list of P0/P1/P2 3-vectors).
TITLE:
  - "Bond-based peridynamics: Kalthoff-Winkler edge impact on a notched plate"
PROBLEM TYPE:
  PROBLEMTYPE: "Particle"
IO:
  STDOUTEVERY: 30
  VERBOSITY: "Standard"
BINNING STRATEGY:
  BIN_SIZE_LOWER_BOUND: 50
  DOMAINBOUNDINGBOX: "-75 -100 -75 275 175 75"
PARTICLE DYNAMIC:
  DYNAMICTYPE: "VelocityVerlet"
  INTERACTION: "SPH"
  PD_BODY_INTERACTION: true
  TIMESTEP: 6.33e-07
  NUMSTEP: 300
  MAXTIME: 1.0
  RESULTSEVERY: 30
  RESTARTEVERY: 0
  GRAVITY_ACCELERATION: "0.0 0.0 0.0"
  PHASE_TO_MATERIAL_ID: "pdphase 1"
  PHASE_TO_DYNLOADBALFAC: "pdphase 1.0"
PARTICLE DYNAMIC/INITIAL AND BOUNDARY CONDITIONS:
  CONSTRAINT: Projection2D
PARTICLE DYNAMIC/SPH:
  KERNEL_SPACE_DIM: Kernel2D
  INITIALPARTICLESPACING: 12.5
PARTICLE DYNAMIC/PD:
  PD_DIMENSION: Peridynamic_2DPlaneStrain
  INTERACTION_HORIZON: 37.5
  PERIDYNAMIC_GRID_SPACING: 12.5
  PRE_CRACKS: "75 0.0 75 50 ; 125 0.0 125 50"
  IMPACTOR_VELOCITY: "0.0 22000 0.0"
  NORMALCONTACTLAW: NormalLinearSpring
  NORMAL_STIFF: 5000
MATERIALS:
  - MAT: 1
    MAT_ParticlePD:
      INITRADIUS: 6.25
      INITDENSITY: 7.8e-09
      YOUNG: 190000
      CRITICAL_STRETCH: 0.002841
PARTICLES:
  - "TYPE pdphase POS 6.25 6.25 0.0 PDBODYID 0"
  - "TYPE pdphase POS 6.25 18.75 0.0 PDBODYID 0"
  - "TYPE pdphase POS 6.25 31.25 0.0 PDBODYID 0"
