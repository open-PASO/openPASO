TITLE:
  - "Beam-to-solid volume meshtying: a slender Reissner beam is embedded in a"
  - "solid column and tied to it with a penalty (gauss-point-to-segment)"
  - "constraint. The clamped solid base holds the embedded part of the beam,"
  - "the overhanging beam tip is pulled sideways and drags the solid along."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
DISCRETISATION:
  NUMFLUIDDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
IO:
  VERBOSITY: "Standard"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  ELEMENT_OWNER: true
IO/RUNTIME VTK OUTPUT/BEAMS:
  OUTPUT_BEAMS: true
  DISPLACEMENT: true
  TRIAD_VISUALIZATIONPOINT: true
  STRAINS_GAUSSPOINT: true
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  TOLDISP: 1e-11
  TOLRES: 1e-06
  MAXITER: 20
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
BEAM INTERACTION:
  REPARTITIONSTRATEGY: "Everydt"
  # No SEARCH_STRATEGY: a 4C before 2026.2.0 defaults to bruteforce_with_binning, and
  # 4C 2026.2.0 removed the key (it always searches with ArborX), so leaving it out
  # reads on every release.
BEAM INTERACTION/BEAM TO SOLID VOLUME MESHTYING:
  CONTACT_DISCRETIZATION: gauss_point_to_segment
  CONSTRAINT_STRATEGY: penalty
  PENALTY_PARAMETER: 1e+10
BEAM INTERACTION/BEAM TO SOLID VOLUME MESHTYING/RUNTIME VTK OUTPUT:
  WRITE_OUTPUT: true
  NODAL_FORCES: true
  SEGMENTATION: true
  INTEGRATION_POINTS: true
BINNING STRATEGY:
  BIN_SIZE_LOWER_BOUND: 2
  DOMAINBOUNDINGBOX: "-2 -2 -2 2 2 2"
BEAM INTERACTION/BEAM TO SOLID VOLUME MESHTYING VOLUME:
  - E: 1
    COUPLING_ID: 1
BEAM INTERACTION/BEAM TO SOLID VOLUME MESHTYING LINE:
  - E: 1
    COUPLING_ID: 1
DESIGN POINT DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 9
    ONOFF: [1, 1, 1, 1, 1, 1, 0, 0, 0]
    VAL: [0, 0, 0, 0, 0, 0, 0, 0, 0]
    FUNCT: [0, 0, 0, 0, 0, 0, 0, 0, 0]
  - E: 2
    NUMDOF: 9
    ONOFF: [0, 1, 0, 0, 0, 0, 0, 0, 0]
    VAL: [0, 0.25, 0, 0, 0, 0, 0, 0, 0]
    FUNCT: [0, 1, 0, 0, 0, 0, 0, 0, 0]
DESIGN SURF DIRICH CONDITIONS:
