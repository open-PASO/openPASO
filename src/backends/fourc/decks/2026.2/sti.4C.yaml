TITLE:
  - "STI: monolithic scalar-thermo interaction of a 1D lithium-ion cell."
  - "Cube-shaped anode | electrolyte | cathode blocks with two electrode-electrolyte
    interfaces coupled by mortar S2I meshtying with Butler-Volmer-Peltier charge
    transfer kinetics; galvanostatic discharge from the fully charged state, adiabatic
    outer boundaries, temperature field driven by Peltier and Joule heat."
PROBLEM TYPE:
  PROBLEMTYPE: "Scalar_Thermo_Interaction"
SCALAR TRANSPORT DYNAMIC:
  SOLVERTYPE: "nonlinear"
  NUMSTEP: 4
  TIMESTEP: 5
  INITIALFIELD: "field_by_condition"
  CALCFLUX_BOUNDARY: "total"
  LINEAR_SOLVER: 1
SCALAR TRANSPORT DYNAMIC/STABILIZATION:
  STABTYPE: "no_stabilization"
  DEFINITION_TAU: "Zero"
  EVALUATION_TAU: "integration_point"
  EVALUATION_MAT: "integration_point"
ELCH CONTROL:
  EQUPOT: "divi"
  DIFFCOND_FORMULATION: true
  INITPOTCALC: true
SCALAR TRANSPORT DYNAMIC/S2I COUPLING:
  COUPLINGTYPE: "StandardMortar"
MORTAR COUPLING:
  MESH_RELOCATION: "None"
MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"
STI DYNAMIC:
  SCATRATIMINTTYPE: "Elch"
  COUPLINGTYPE: "Monolithic"
  THERMO_INITIALFIELD: "field_by_function"
  THERMO_INITFUNCNO: 4
  THERMO_LINEAR_SOLVER: 1
STI DYNAMIC/MONOLITHIC:
  LINEAR_SOLVER: 1
  MATRIXTYPE: "sparse"
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_electrode:
      DIFF_COEF_CONC_DEP_FUNCT: -1
