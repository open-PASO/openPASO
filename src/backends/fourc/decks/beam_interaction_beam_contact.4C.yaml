TITLE:
  - "Beam-to-beam contact: a straight Kirchhoff beam is pressed against and slid"
  - "over a second, arc-shaped beam. Penalty contact with element segmentation."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
DISCRETISATION:
  NUMFLUIDDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
IO:
  VERBOSITY: "Standard"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/BEAMS:
  OUTPUT_BEAMS: true
  DISPLACEMENT: true
  STRAINS_GAUSSPOINT: true
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  NUMSTEP: 18
  MAXTIME: 1.8
  TOLDISP: 1e-07
  TOLRES: 1e-07
  LOADLIN: true
  PREDICT: "TangDis"
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
BEAM INTERACTION:
  # No SEARCH_STRATEGY: a 4C before 2026.2.0 defaults to bruteforce_with_binning, and
  # 4C 2026.2.0 removed the key (it always searches with ArborX), so leaving it out
  # reads on every release.
BEAM INTERACTION/BEAM TO BEAM CONTACT:
  BEAMS_SEGCON: true
  BEAMS_BTBPENALTYPARAM: 10000
  BEAMS_BTBLINEPENALTYPARAM: 0
  BEAMS_PERPSHIFTANGLE1: 0.001
  BEAMS_PERPSHIFTANGLE2: 0.01
  BEAMS_PARSHIFTANGLE1: 0.19
  BEAMS_PARSHIFTANGLE2: 0.2
  BEAMS_SEGANGLE: 1
  BEAMS_NUMINTEGRATIONINTERVAL: 10
  BEAMS_PENALTYLAW: "LinPosQuadPen"
  BEAMS_PENREGPARAM_G0: 0.001
  BEAMS_PENREGPARAM_F0: 0
  BEAMS_PENREGPARAM_C0: 0
  BEAMS_NEWGAP: false
BEAM INTERACTION/BEAM TO BEAM CONTACT/RUNTIME VTK OUTPUT:
  VTK_OUTPUT_BEAM_CONTACT: true
  INTERVAL_STEPS: 1
  CONTACT_FORCES: true
  GAPS: true
BEAM INTERACTION/BEAM TO BEAM CONTACT CONDITIONS:
  - E: 1
    COUPLING_ID: 1
  - E: 2
    COUPLING_ID: 1
BINNING STRATEGY:
  BIN_SIZE_LOWER_BOUND: 5
  DOMAINBOUNDINGBOX: "-5 -5 -5 5 5 5"
STRUCT NOX/Printing:
  Inner Iteration: false
  Outer Iteration StatusTest: false
DESIGN POINT DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 6
    ONOFF: [1, 1, 1, 1, 1, 1]
    VAL: [0.5707, 0, 0, -1, 0, 1]
    FUNCT: [0, 0, 0, 0, 0, 0]
  - E: 2
    NUMDOF: 6
    ONOFF: [1, 1, 1, 1, 1, 1]
    VAL: [-0.5707, 0, 0, -1, 0, -1]
    FUNCT: [0, 0, 0, 0, 0, 0]
  - E: 3
    NUMDOF: 6
    ONOFF: [1, 1, 1, 0, 0, 0]
    VAL: [0, 0.03, 0.606, 0, 0, 0]
    FUNCT: [0, 1, 2, 0, 0, 0]
  - E: 4
    NUMDOF: 6
    ONOFF: [1, 1, 1, 0, 0, 0]
    VAL: [0, 0.03, 0.606, 0, 0, 0]
    FUNCT: [0, 1, 2, 0, 0, 0]
DNODE-NODE TOPOLOGY:
  - "NODE 1 DNODE 1"
  - "NODE 2 DNODE 2"
  - "NODE 3 DNODE 3"
  - "NODE 6 DNODE 4"
DLINE-NODE TOPOLOGY:
  - "NODE 1 DLINE 1"
  - "NODE 2 DLINE 1"
  - "NODE 3 DLINE 2"
  - "NODE 4 DLINE 2"
  - "NODE 5 DLINE 2"
  - "NODE 6 DLINE 2"
NODE COORDS:
  - "NODE 1 COORD -1.570700000000e+00 0.00000000000000e+00 0.000000000000000e+00"
  - "NODE 2 COORD 1.5707000000000e+00 0.00000000000000e+00 0.000000000000000e+00"
  - "NODE 3 COORD -2.00000000000e+00 -0.03 0.3e+00"
  - "NODE 4 COORD -0.66666666666e+00 -0.03 0.3e+00"
  - "NODE 5 COORD 0.66666666666e+00 -0.03 0.3e+00"
  - "NODE 6 COORD 2.00000000000e+00 -0.03 0.3e+00"
STRUCTURE ELEMENTS:
  - "1 BEAM3EB LINE2 1 2 MAT 1"
  - "2 BEAM3EB LINE2 3 4 MAT 1"
  - "3 BEAM3EB LINE2 4 5 MAT 1"
  - "4 BEAM3EB LINE2 5 6 MAT 1"
MATERIALS:
  - MAT: 1
    MAT_BeamKirchhoffTorsionFreeElastHyper:
      YOUNG: 1e+09
      DENS: 0
      CROSSAREA: 3.1415926535897938e-06
      MOMIN: 7.853981633974484e-09
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 3
    TIMES: [0, 1, 5]
    DESCRIPTION: ["t", "1"]
FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "linearinterpolation"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 0, 1]
