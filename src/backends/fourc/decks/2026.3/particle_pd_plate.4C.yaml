TITLE:
  - "Bond-based peridynamics: pre-cracked 2-D plate pulled in tension"
PROBLEM TYPE:
  PROBLEMTYPE: "Particle"
IO:
  STDOUTEVERY: 20
  VERBOSITY: "Standard"
BINNING STRATEGY:
  BIN_SIZE_LOWER_BOUND: 4
  DOMAINBOUNDINGBOX: "-4 -4 -4 20 13 4"
PARTICLE DYNAMIC:
  DYNAMICTYPE: "VelocityVerlet"
  INTERACTION: "SPH"
  PD_BODY_INTERACTION: true
  TIMESTEP: 5.07e-08
  NUMSTEP: 200
  MAXTIME: 1.0
  RESULTSEVERY: 20
  RESTARTEVERY: 0
  GRAVITY_ACCELERATION: "0.0 0.0 0.0"
  PHASE_TO_MATERIAL_ID: "pdphase 1"
  PHASE_TO_DYNLOADBALFAC: "pdphase 1.0"
PARTICLE DYNAMIC/INITIAL AND BOUNDARY CONDITIONS:
  DIRICHLET_BOUNDARY_CONDITION_FLAGGED: [pdphase]
  CONSTRAINT: Projection2D
PARTICLE DYNAMIC/SPH:
  KERNEL_SPACE_DIM: Kernel2D
  INITIALPARTICLESPACING: 1
PARTICLE DYNAMIC/PD:
  PD_DIMENSION: Peridynamic_2DPlaneStress
  INTERACTION_HORIZON: 3
  PERIDYNAMIC_GRID_SPACING: 1
  PRE_CRACK_LINES:
    - START: [0.0, 4.5, 0.0]
      END: [8.0, 4.5, 0.0]
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0"
  - COMPONENT: 1
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0"
  - COMPONENT: 2
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0"
FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0*t"
  - COMPONENT: 1
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "10000.0*t"
  - COMPONENT: 2
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0*t"
MATERIALS:
  - MAT: 1
    MAT_ParticlePD:
      INITRADIUS: 0.5
      INITDENSITY: 7.8e-09
      YOUNG: 190000
      CRITICAL_STRETCH: 0.010044
PARTICLES:
  - "TYPE pdphase POS 0.5 0.5 0.0 PDBODYID 0 DIRICHLET_FUNCT 1"
  - "TYPE pdphase POS 0.5 1.5 0.0 PDBODYID 0"
