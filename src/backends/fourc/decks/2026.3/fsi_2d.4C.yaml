TITLE:
  - "Partitioned 2-D FSI: elastic block driving a channel flow (Dirichlet-Neumann)"
PROBLEM SIZE:
  DIM: 2
PROBLEM TYPE:
  PROBLEMTYPE: "Fluid_Structure_Interaction"
STRUCTURAL DYNAMIC:
  PREDICT: "ConstAcc"
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC/GENALPHA:
  BETA: 0.5
  GAMMA: 1
  ALPHA_M: 0
  ALPHA_F: 0
  RHO_INF: -1
STRUCT NOX/Printing:
  Inner Iteration: false
  Outer Iteration StatusTest: false
FLUID DYNAMIC:
  LINEAR_SOLVER: 1
  NONLINITER: Newton
  THETA: 1
FLUID DYNAMIC/RESIDUAL-BASED STABILIZATION:
  CHARELELENGTH_PC: "root_of_volume"
ALE DYNAMIC:
  LINEAR_SOLVER: 1
FSI DYNAMIC:
  COUPALGO: "iter_stagg_fixed_rel_param"
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  RESTARTEVERY: 10
SOLVER 1:
  SOLVER: "UMFPACK"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
IO/RUNTIME VTK OUTPUT/FLUID:
  OUTPUT_FLUID: true
  VELOCITY: true
  # 4C 2026.3.0 writes the 2-D pressure as its own array and velocity with two components.
  # (4C 2026.2.0 and older builds write the pressure as a third velocity component and a
  # NaN pressure array.)
  PRESSURE: true
  DISPLACEMENT: true
MATERIALS:
  - MAT: 1
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 10000
      NUE: 0
      DENS: 1000
  - MAT: 2
    MAT_fluid:
      DYNVISCOSITY: 1
      DENSITY: 1
  - MAT: 3
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 1
      NUE: 0
      DENS: 0
CLONING MATERIAL MAP:
  - SRC_FIELD: "fluid"
    SRC_MAT: 2
    TAR_FIELD: "ale"
    TAR_MAT: 3
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.05*(1.0-cos(pi*t))"
DESIGN POINT DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 2
    ONOFF: [1, 1]
    VAL: [1, 0]
    FUNCT: [1, 0]
DESIGN LINE ALE DIRICH CONDITIONS:
  - E: 3
    NUMDOF: 2
    ONOFF: [1, 1]
    VAL: [0, 0]
    FUNCT: [0, 0]
DESIGN FSI COUPLING LINE CONDITIONS:
  - E: 1
    coupling_id: 1
  - E: 2
    coupling_id: 1
DNODE-NODE TOPOLOGY:
  - "NODE 1 DNODE 1"
  - "NODE 2 DNODE 1"
  - "NODE 5 DNODE 1"
DLINE-NODE TOPOLOGY:
  - "NODE 7 DLINE 1"
  - "NODE 8 DLINE 1"
  - "NODE 9 DLINE 1"
  - "NODE 10 DLINE 2"
  - "NODE 11 DLINE 2"
  - "NODE 14 DLINE 2"
  - "NODE 34 DLINE 3"
  - "NODE 35 DLINE 3"
  - "NODE 36 DLINE 3"
