TITLE:
  - "SSI: 2D structure-scalar interaction, single QUAD4, one-way solid-to-scatra"
PROBLEM SIZE:
  DIM: 2
PROBLEM TYPE:
  PROBLEMTYPE: "Structure_Scalar_Interaction"
DISCRETISATION:
  NUMSTRUCDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
IO:
  STRUCT_DISP: false
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "OneStepTheta"
  LINEAR_SOLVER: 1
STRUCT NOX/Printing:
  Inner Iteration: false
  Outer Iteration StatusTest: false
SCALAR TRANSPORT DYNAMIC:
  SOLVERTYPE: "nonlinear"
  MAXTIME: 2
  NUMSTEP: 10000
  TIMESTEP: 1
  RESTARTEVERY: 20
  VELOCITYFIELD: "Navier_Stokes"
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 1
  OUTPUTSCALARS: "entire_domain"
  CONVFORM: "conservative"
  LINEAR_SOLVER: 1
SCALAR TRANSPORT DYNAMIC/STABILIZATION:
  STABTYPE: "no_stabilization"
SSI CONTROL:
  NUMSTEP: 4
  MAXTIME: 4
  TIMESTEP: 1
  COUPALGO: ssi_OneWay_SolidToScatra
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Sca_Tra_Solver"
MATERIALS:
  - MAT: 1
    MAT_scatra:
      DIFFUSIVITY: 1
  - MAT: 2
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 10
      NUE: 0.35
      DENS: 0.1
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 2
    TAR_FIELD: "scatra"
    TAR_MAT: 1
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "1.0"
FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "(x+0.5)*t"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 2
    ONOFF: [1, 1]
    VAL: [1, 0]
    FUNCT: [2, 0]
DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
NODE COORDS:
  - "NODE 1 COORD  5.0000000000000000e-01  5.0000000000000000e-01 0.0"
  - "NODE 2 COORD -5.0000000000000000e-01  5.0000000000000000e-01 0.0"
  - "NODE 3 COORD -5.0000000000000000e-01 -5.0000000000000000e-01 0.0"
  - "NODE 4 COORD  5.0000000000000000e-01 -5.0000000000000000e-01 0.0"
STRUCTURE ELEMENTS:
  - "1 SOLIDSCATRA QUAD4 1 2 3 4 MAT 2 KINEM nonlinear THICKNESS 1 PLANE_ASSUMPTION plane_strain TYPE Std"
