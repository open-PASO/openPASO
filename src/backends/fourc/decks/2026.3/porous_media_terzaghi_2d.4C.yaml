TITLE:
  - "Terzaghi 1-D consolidation, solved as a 2-D poroelastic column (QUAD4)."
  - "Saturated soil column 0.1 x 1.0, surface load q=1 ramped on over 0.05 s,"
  - "drained at the top (p=0), impervious base and sides, lateral rollers."
  - "The excess pore pressure starts at ~q everywhere and dissipates upwards;"
  - "the settlement tends to the drained oedometric value q*H/E_oed —"
  - "evaluate that for your own parameters rather than expecting a number."
  - "NOTE: 4C 2026.3.0 writes the 2-D pore pressure as its own PRESSURE array"
  - "(switched on below) and a two-component velocity; 4C 2026.2.0 writes that"
  - "array as NaN and the pore pressure as a third velocity component."
PROBLEM TYPE:
  PROBLEMTYPE: "Poroelasticity"
PROBLEM SIZE:
  DIM: 2
POROELASTICITY DYNAMIC:
  COUPALGO: "Monolithic"
  NUMSTEP: 80
  MAXTIME: 2.0
  TIMESTEP: 0.025
  ITEMAX: 25
  TOLINC_GLOBAL: 1e-08
  TOLRES_GLOBAL: 1e-08
  NORM_INC: "AbsGlobal"
  NORM_RESF: "AbsGlobal"
  SECONDORDER: false
  CONTIPARTINT: true
  RESULTSEVERY: 2
  RESTARTEVERY: 1000
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC:
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "OneStepTheta"
  DAMPING: "Material"
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC/ONESTEPTHETA:
  THETA: 1.0
FLUID DYNAMIC:
  LINEAR_SOLVER: 3
  THETA: 1.0
FLUID DYNAMIC/POROUS-FLOW STABILIZATION:
  SUPG: false
  GRAD_DIV: false
  RSTAB: "rstab_gls"
  DEFINITION_TAU: "Franca_Madureira_Valentin_Badia_Codina"
  EVALUATION_TAU: "integration_point"
  EVALUATION_MAT: "integration_point"
SOLVER 1:
  SOLVER: "UMFPACK"
SOLVER 2:
  SOLVER: "UMFPACK"
SOLVER 3:
  SOLVER: "UMFPACK"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 2
  OUTPUT_DATA_FORMAT: "ascii"
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
IO/RUNTIME VTK OUTPUT/FLUID:
  OUTPUT_FLUID: true
  VELOCITY: true
  # the pore pressure: its own array from 4C 2026.3.0 on (before, a NaN array and a third
  # velocity component)
  PRESSURE: true
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "porofluid"
    TAR_MAT: 3
MATERIALS:
  - MAT: 1
    MAT_StructPoro:
      MATID: 2
      POROLAWID: 10
      INITPOROSITY: 0.4
  - MAT: 10
    MAT_PoroLawNeoHooke:
      BULKMODULUS: 1e+07
      PENALTYPARAMETER: 0.001
  - MAT: 2
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [4]
      DENS: 1.0
  - MAT: 4
    ELAST_CoupNeoHooke:
      YOUNG: 1000
      NUE: 0.2
  - MAT: 3
    MAT_FluidPoro:
      DYNVISCOSITY: 1.0
      DENSITY: 1.0
      PERMEABILITY: 0.001
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 3
    TIMES: [0.0, 0.05, 1000.0]
    DESCRIPTION: ["0.5*(1-cos(t*pi/0.05))", "1.0"]
DESIGN LINE NEUMANN CONDITIONS:
  - E: 4
    NUMDOF: 2
    ONOFF: [0, 1]
    VAL: [0.0, -1.0]
    FUNCT: [0, 1]
DESIGN LINE DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 2
    ONOFF: [1, 0]
    VAL: [0, 0]
    FUNCT: [0, 0]
  - E: 2
    NUMDOF: 2
    ONOFF: [1, 0]
    VAL: [0, 0]
    FUNCT: [0, 0]
  - E: 3
    NUMDOF: 2
    ONOFF: [1, 1]
    VAL: [0, 0]
    FUNCT: [0, 0]
DESIGN LINE PORO DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 3
    NUMDOF: 3
    ONOFF: [1, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN LINE PORO PARTIAL INTEGRATION:
  - E: 4
DESIGN SURFACE POROCOUPLING CONDITION:
  - E: 1
