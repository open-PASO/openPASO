    - START: [125.0, 0.0, 0.0]
      END: [125.0, 50.0, 0.0]
  NORMALCONTACTLAW: NormalLinearSpring
  NORMAL_STIFF: 5000
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0*t"
  - COMPONENT: 1
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "22000.0*t"
  - COMPONENT: 2
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.0*t"
MATERIALS:
  - MAT: 1
    MAT_ParticlePD:
      INITRADIUS: 6.25
      INITDENSITY: 7.8e-09
      YOUNG: 190000
      CRITICAL_STRETCH: 0.002841
