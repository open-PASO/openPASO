[project]
name = "openpaso"
version = "1.3.0"
description = "openPASO — open Platform for Agentic Simulation and Optimization. An MCP server that lets an AI model operate nine finite-element and multiphysics codes: simulation, cross-code coupling, verification and solver development."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "openPASO Contributors"},
]
keywords = ["fem", "mcp", "simulation", "multiphysics", "coupling",
            "ai-agent", "verification", "finite-element"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # PINNED BELOW 2. mcp 2.x renamed FastMCP to MCPServer and changed other
    # APIs, so server.py stops at import with "No module named
    # 'mcp.server.fastmcp'". The old bound was >=1.2.0, which today resolves
    # to 2.x: every fresh install was broken while existing environments kept
    # working on an older resolution, so nothing here noticed. Measured on a
    # clean venv, Python 3.13, which picked mcp 2.2.0.
    "mcp[cli]>=1.2.0,<2",
    # src/blind_eval/{derive,leakgate,coupled}.py import it at module level.
    # It was never declared: a clean install could not even collect the test
    # suite ("No module named 'sympy'"), and importing those modules failed.
    "sympy>=1.12",
    "pyyaml>=6.0",
    # numpy capped <2 because pyprecice 3.1.2, the binding that pairs with
    # libprecice 3.1.2, pins numpy<2 (pyprecice 3.0.0-3.1.1 and 3.2.0-3.4.0
    # declare no numpy upper bound, and 3.2+ needs libprecice >= 3.2); scipy
    # capped <1.16 because scipy>=1.16 uses numpy-2-only dtypes (np.long) and
    # requires numpy>=2.0, which silently breaks scikit-fem on a numpy-1.x
    # install (dep conflict).
    "numpy>=1.24,<2",
    "pyvista>=0.43",
    "meshio>=5.3",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "scipy>=1.10,<1.16",
    # adios2 lets the verification gate scan ADIOS2/.bp output (dolfinx VTXWriter,
    # e.g. P2/Taylor-Hood Stokes) for NaN/Inf. Without it the gate cannot read
    # .bp and only emits an honesty note, so a NaN-filled .bp could read as
    # verified — the SEV-HIGH fabrication gap this closes.
    "adios2>=2.10",
    # generate_mesh imports gmsh IN THIS INTERPRETER, unlike the solvers, which are found
    # wherever they live. Measured on a real run: every solver was found, the mesh tool could
    # not work, the model wrote its own gmsh script which could not import gmsh either, and the
    # run spent its budget producing nothing. A mesh generator every install has is worth 50 MB.
    "gmsh>=4.12",
    # scikit-fem is pure Python and small (a 178 KB wheel that runs on the numpy
    # pinned above), so `pip install openpaso` gives a working solver out of the
    # box; the other pip-installable solvers stay extras because they are large
    # (NGSolve, Kratos) or need MPI (DUNE).
    "scikit-fem>=10.0",
]

[project.urls]
Homepage = "https://github.com/open-PASO/openPASO"
Repository = "https://github.com/open-PASO/openPASO"
Documentation = "https://open-paso.github.io/openPASO/"
Issues = "https://github.com/open-PASO/openPASO/issues"

[project.scripts]
# `openpaso` starts the MCP server on stdio: the command an AI tool's MCP
# configuration points at. It does the same thing `python src/server.py`
# does in a checkout.
openpaso = "openpaso:main"

[project.optional-dependencies]
# Individual solver backends
fenics = ["fenics-dolfinx>=0.8"]     # gmsh is a core dependency, see above
ngsolve = ["ngsolve>=6.2"]
skfem = ["scikit-fem>=10.0"]
kratos = ["KratosMultiphysics>=10.0"]
dune = ["dune-fem>=2.10", "mpi4py>=3.0"]

# The browser interface. Its dependencies lived only in a README command, so nothing could
# install it from the package and its own tests could not be collected on a fresh clone
# (measured on the product cut: "No module named fastapi").
webui = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9",
         "websockets>=12.0", "httpx>=0.27"]

# Coupling infrastructure
precice = ["pyprecice>=3.0"]

# All pip-installable backends
all-solvers = [
    "ngsolve>=6.2",
    "scikit-fem>=10.0",
    "KratosMultiphysics>=10.0",
]

# Running the tests that ship with openPASO: pip install -e ".[test]"
test = ["pytest>=7.0", "pytest-asyncio>=0.20", "openpaso[webui]"]


[tool.pytest.ini_options]
# `pythonpath` is what lets a test import the server from src/ without installing a path hack.
pythonpath = ["src"]
testpaths = ["webui/tests/test_app.py", "tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
